name: Build InMotion Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: titanium-release
  cancel-in-progress: true

jobs:
  build-release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Package standalone release
        run: |
          mkdir -p release/.next/static release/public
          cp -a .next/standalone/. release/
          cp -a .next/static/. release/.next/static/
          cp -a public/. release/public/
          tar -czf titanium-release.tar.gz -C release .

      - name: Publish release branch
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          workdir="$(mktemp -d)"
          cp titanium-release.tar.gz "$workdir/"
          cd "$workdir"
          git init
          git checkout -b release
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          printf '%s\n' "$SOURCE_SHA" > source-sha.txt
          git add titanium-release.tar.gz source-sha.txt
          git commit -m "Release $SOURCE_SHA"
          git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          git push --force origin release
